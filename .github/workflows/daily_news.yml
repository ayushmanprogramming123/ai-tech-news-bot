name: Daily AI & Tech News Bot

on:
  schedule:
    - cron: '30 2 * * *' # Runs everyday at 2:30 AM UTC, which is exactly 8:00 AM IST (Indian Standard Time)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news generator
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python fetch_news.py

      - name: Commit and push report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git mad reports/ || true
          git add reports/
          git commit -m "chore: add beautiful HTML tech news report for $(date +%Y-%m-%d)" || exit 0
          git push
